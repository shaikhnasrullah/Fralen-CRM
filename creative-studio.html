<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fralen AI Creative Studio</title>
<style>
:root{--navy:#0f1f3d;--amber:#f5a623;--line:#e1e5ee;--bg:#f6f7fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.4 system-ui,sans-serif;color:#1d2433}
header{display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;padding:.8rem 1rem;border-bottom:3px solid var(--amber)}
header b{color:var(--amber);font-size:1.1rem}header span{display:block;font-size:.8rem;color:#c3cde0}
.app{display:grid;grid-template-columns:340px 1fr;gap:1rem;padding:1rem;max-width:1200px;margin:auto}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:1rem;align-self:start}
.panel h3{margin:.8rem 0 .4rem;font-size:.85rem;color:var(--navy);text-transform:uppercase;letter-spacing:.04em}
.panel h3:first-child{margin-top:0}
label{display:block;font-size:.8rem;margin:.5rem 0 .15rem;color:#5b6578}
input[type=text],textarea,select{width:100%;padding:.5rem;border:1px solid #c9cfdc;border-radius:6px;font:inherit}
textarea{resize:vertical;min-height:54px}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{padding:.4rem .6rem;border:2px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:.8rem}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff}
.stage{display:flex;flex-direction:column;align-items:center;gap:.8rem}
.cvwrap{background:#dfe3ec;border-radius:8px;padding:.8rem;width:100%;display:flex;justify-content:center}
canvas{max-width:100%;max-height:78vh;height:auto;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.2);touch-action:none;cursor:grab}
.btns{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
button.b{padding:.6rem 1rem;border-radius:6px;border:2px solid var(--navy);background:#fff;color:var(--navy);font:600 .9rem system-ui;cursor:pointer}
button.b.p{background:var(--navy);color:#fff}
#msg{font-size:.8rem;color:#5b6578;min-height:1.2em}
@media(max-width:820px){.app{grid-template-columns:1fr}}
</style></head><body>
<header><div><b>🎨 Fralen AI Creative Studio</b><span>Create. Customize. Promote. Grow.</span></div><a href="dashboard.html" style="color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.3);padding:.4rem .8rem;border-radius:6px;font-size:.85rem">← Dashboard</a></header>
<div class="app">
<div class="panel">
<h3>My designs</h3>
<label>Design name</label><input type="text" id="dName" placeholder="e.g. Diwali sale">
<div class="btns" style="margin:.5rem 0;justify-content:flex-start"><button class="b p" id="dSave">Save design</button><button class="b" id="dNew">New</button></div>
<label>Saved designs</label><select id="dList"><option value="">Loading...</option></select>
<div class="btns" style="margin:.5rem 0;justify-content:flex-start"><button class="b" id="dOpen">Open</button><button class="b" id="dDel">Delete</button></div>
<div id="dMsg" style="font-size:.8rem;color:#5b6578"></div>
<label>Use one of my products</label><select id="pList"><option value="">Select product</option></select>
<h3>Layout style</h3><div class="chips" id="styles"></div><h3>Colour theme</h3><div class="chips" id="tpls"></div>
<h3>Size</h3><div class="chips" id="sizes"></div>
<h3>Content</h3>
<label>Shop name</label><input type="text" id="shop">
<label>Headline</label><input type="text" id="headline">
<label>Offer label</label><input type="text" id="offer">
<label>Details</label><textarea id="details"></textarea>
<label>Subline</label><input type="text" id="sub"><label>Button text</label><input type="text" id="cta"><label>Features (comma separated)</label><input type="text" id="feats"><label>Tagline</label><input type="text" id="tag"><label>Phone</label><input type="text" id="phone">
<label>Address</label><input type="text" id="address">
<label>Valid till</label><input type="text" id="valid" placeholder="e.g. 31 Oct 2026">
<h3>AI Artwork</h3>
<label>Art direction</label><select id="aiStyle"><option value="A">A: Lifestyle model</option><option value="B">B: Oversized eyewear concept</option><option value="C">C: Luxury cinematic</option><option value="D">D: Product collection</option><option value="E">E: Urban lifestyle</option><option value="F">F: Festival / seasonal</option></select>
<label>Occasion</label><select id="aiOcc"><option value="">None</option><option value="diwali">Diwali</option><option value="eid">Eid</option><option value="newyear">New Year</option><option value="summer">Summer</option><option value="school">Back to school</option><option value="opening">Grand opening</option></select>
<label><input type="checkbox" id="aiModel" checked> Include a model</label>
<label>Extra instructions</label><textarea id="aiNotes" placeholder="e.g. tortoiseshell frames, warm beige tones"></textarea>
<div class="btns" style="margin-top:.5rem"><button class="b p" id="aiGen">Generate artwork</button><button class="b" id="aiCancel" hidden>Cancel</button></div>
<div id="aiMsg" style="font-size:.8rem;color:#5b6578;margin-top:.4rem"></div>
<h3>Images</h3>
<label>Shop logo (PNG/JPG, max 5 MB)</label><input type="file" id="logo" accept="image/png,image/jpeg,image/webp">
<label>Background / hero photo</label><input type="file" id="bg" accept="image/png,image/jpeg,image/webp"><label>Product or model photo (transparent PNG is best)</label><input type="file" id="prod" accept="image/png,image/jpeg,image/webp">
</div>
<div class="stage">
<div class="cvwrap"><canvas id="cv"></canvas></div>
<div class="btns">
<button class="b p" id="png">Download PNG</button>
<button class="b" id="jpg">Download JPEG</button>
<button class="b" id="share">Share</button>
<button class="b" id="reset">Reset positions</button>
</div>
<div id="msg">Tip: drag the headline, offer, product or footer on the poster to move it.</div>
</div></div>
