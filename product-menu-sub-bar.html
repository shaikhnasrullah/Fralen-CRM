<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 <!-- Favicon -->
<link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<link rel="shortcut icon" href="/favicon/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
<link rel="manifest" href="/favicon/site.webmanifest">
<meta name="description" content="FRALEN CRM is a multi-tenant optical shop management system — manage customers, orders, prescriptions, purchases, inventory, and sales reports for your eyewear business, all in one place."/>
<meta name="keywords" content="FRALEN CRM, optical shop CRM, eyewear shop software, optical store management, frame lens billing software"/>
<meta name="robots" content="index, follow"/>
<link rel="canonical" href="https://www.fralencrm.in/">

<title>Products Menu - FRALEN CRM</title>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#eef1f6;
  margin:0;
  padding:0;
}


/* FULL WIDTH CONTAINER */
.wrap{
  width:100%;
  margin:0;
}


/* HEADER */
.header{
  width:100%;
  background:#1b2a6b;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}


.logo{
  font-weight:800;
  font-size:20px;
  letter-spacing:1px;
  color:white;
}

.logo .accent{
  color:#6f8cff;
}


.back{
  background:#2f3f8a;
  color:white;
  border:none;
  border-radius:8px;
  padding:8px 16px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
}


/* TITLE */
.section-title{

  width:100%;
  background:white;
  padding:18px 20px 14px;

  font-size:22px;
  font-weight:800;

  color:#1b2a6b;

  border-bottom:3px solid #3b57e0;
}



/* PRODUCTS BUTTON */

.products-toggle{

  width:100%;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:#1b2a6b;

  color:white;

  border:none;

  padding:14px 20px;

  font-size:15px;

  font-weight:800;

  cursor:pointer;
}


.chev{
 transition:.2s;
}

.chev.closed{
 transform:rotate(-90deg);
}


/* PRODUCT TABS */

.subbar{

 display:none;

 gap:10px;

 padding:14px;

 background:#eef1f6;

 overflow-x:auto;

}


.subbar.open{
 display:flex;
}



.tab{

 flex:0 0 auto;

 display:flex;

 align-items:center;

 gap:8px;

 padding:14px 18px;

 border-radius:10px;

 border:2px solid #c7d0e8;

 background:white;

 color:#1b2a6b;

 font-weight:700;

 cursor:pointer;

 white-space:nowrap;

}


.tab.active{

 background:#1b2a6b;

 color:white;

 border-color:#1b2a6b;

}


/* CATEGORY */

.cat-row{

 display:none;

 gap:10px;

 padding:5px 14px 14px;

 background:#eef1f6;

 overflow-x:auto;

}


.cat-row.open{

 display:flex;

}



.cat-tab{

 flex:0 0 auto;

 padding:10px 14px;

 border-radius:8px;

 border:2px solid #d7deef;

 background:white;

 color:#3a4a8a;

 font-weight:600;

 cursor:pointer;

 white-space:nowrap;

}



.cat-tab.active{

 background:#3b57e0;

 color:white;

 border-color:#3b57e0;

}


.footer-space{
 height:10px;
}

/* PRODUCT LIST */
.list-wrap{
  padding:14px 20px 30px;
}
.search-row{
  display:flex;
  gap:10px;
  margin-bottom:14px;
}
.search-row input{
  flex:1;
  padding:11px 14px;
  border:1.5px solid #c7d0e8;
  border-radius:9px;
  font-size:14px;
  font-family:inherit;
  outline:none;
}
.search-row input:focus{
  border-color:#3b57e0;
}
.refresh-btn{
  background:#1b2a6b;
  color:white;
  border:none;
  border-radius:9px;
  padding:0 16px;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
}
.prod-card{
  background:white;
  border:1.5px solid #dbe2f0;
  border-radius:10px;
  padding:14px 16px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  flex-wrap:wrap;
}
.prod-info h4{
  font-size:15px;
  color:#1b2a6b;
  font-weight:800;
  margin-bottom:4px;
}
.prod-meta{
  font-size:12px;
  color:#6b7280;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:6px;
}
.prod-meta span{
  background:#eef1f6;
  padding:2px 9px;
  border-radius:20px;
}
.prod-price{
  font-size:13.5px;
  font-weight:700;
  color:#111827;
}
.prod-price .old{
  color:#9ca3af;
  font-weight:500;
  text-decoration:line-through;
  margin-right:6px;
  font-size:12px;
}
.stock-badge{
  font-size:11px;
  font-weight:700;
  padding:2px 9px;
  border-radius:20px;
}
.stock-ok{ background:#D1FAE5; color:#047857; }
.stock-low{ background:#FEF3C7; color:#B45309; }
.stock-out{ background:#FEE2E2; color:#B91C1C; }
.prod-actions{
  display:flex;
  gap:8px;
  flex-shrink:0;
}
.prod-actions button{
  border:none;
  border-radius:7px;
  padding:7px 12px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}
.btn-edit-p{ background:#EEF1FE; color:#3b57e0; }
.btn-del-p{ background:#FEE2E2; color:#dc2626; }
.empty-list{
  text-align:center;
  padding:40px 20px;
  color:#6b7280;
  font-size:13.5px;
}
.loading-list{
  text-align:center;
  padding:30px;
  color:#6b7280;
  font-size:13.5px;
}



</style>

</head>


<body>


<div class="wrap">


<div class="header">

<div class="logo">
FRA<span class="accent">LEN</span> CRM
</div>


<button class="back" onclick="window.location.href='dashboard.html'">
&larr; Back
</button>


</div>



<div class="section-title">
Products
</div>




<button class="products-toggle" onclick="toggleProducts()">

<span>
PRODUCTS MENU
</span>


<svg class="chev" id="productsChev"
width="18"
height="18"
viewBox="0 0 24 24"
fill="none"
stroke="white"
stroke-width="2.5">

<polyline points="6 9 12 15 18 9"/>

</svg>


</button>





<div class="subbar open" id="productsSubbar">


<button class="tab active">
📋 Product List
</button>


<button class="tab" onclick="window.location.href='Add-products-under-subtile.html'">
➕ Add Product
</button>


<button class="tab" onclick="toggleCategories(this)">
🗂️ Categories
</button>


<button class="tab">
🏷️ Brands
</button>


<button class="tab">
📄 Product Details
</button>


</div>





<div class="cat-row" id="categoriesRow">


<button class="cat-tab active" onclick="window.filterCategory(this, 'All')">
🔎 All
</button>

<button class="cat-tab" onclick="window.filterCategory(this, 'Frames')">
👓 Frames
</button>


<button class="cat-tab" onclick="window.filterCategory(this, 'Lenses')">
🔷 Lenses
</button>


<button class="cat-tab" onclick="window.filterCategory(this, 'Contact Lenses')">
👁️ Contact Lenses
</button>


<button class="cat-tab" onclick="window.filterCategory(this, 'Sunglasses')">
🕶️ Sunglasses
</button>


<button class="cat-tab" onclick="window.filterCategory(this, 'Accessories')">
🏷️ Accessories
</button>


<button class="cat-tab" onclick="window.filterCategory(this, 'Eye Drops')">
💧 Eye Drops
</button>


</div>


<!-- PRODUCT LIST VIEW -->
<div class="list-wrap" id="list-view">
  <div class="search-row">
    <input type="text" id="prod-search" placeholder="Search product, brand or SKU..." oninput="window.renderProductList()"/>
    <button class="refresh-btn" onclick="window.loadProducts()">⟳ Refresh</button>
  </div>
  <div id="product-list-body"><div class="loading-list">Loading products...</div></div>
</div>


</div>





<script>


function toggleProducts(){

let bar=document.getElementById("productsSubbar");

let chev=document.getElementById("productsChev");


bar.classList.toggle("open");

chev.classList.toggle("closed");


}




function toggleCategories(){

let row=document.getElementById("categoriesRow");

row.classList.toggle("open");


}


</script>

<script type="module">
  import { getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { requireAuth, tenantCollection } from "./firebase-config.js";

  let currentUid = null;
  let allProducts = [];
  let activeCategory = 'All';

  requireAuth((user) => {
    currentUid = user.uid;
    loadProducts();
  });

  // This is the fix: the "Product List" tab never actually fetched
  // anything before — products saved via Add-products-under-subtile.html
  // went into users/{uid}/products but nothing on this page read them back.
  window.loadProducts = async function () {
    const body = document.getElementById('product-list-body');
    body.innerHTML = '<div class="loading-list">Loading products...</div>';
    try {
      const snap = await getDocs(tenantCollection(currentUid, "products"));
      allProducts = [];
      snap.forEach(d => allProducts.push({ id: d.id, ...d.data() }));
      window.renderProductList();
    } catch (err) {
      body.innerHTML = `<div class="empty-list">Error loading products: ${err.message}</div>`;
    }
  };

  window.filterCategory = function (btn, category) {
    document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCategory = category;
    window.renderProductList();
  };

  window.renderProductList = function () {
    const term = (document.getElementById('prod-search').value || '').toLowerCase();
    const body = document.getElementById('product-list-body');

    let list = allProducts;
    if (activeCategory !== 'All') list = list.filter(p => (p.category || '') === activeCategory);
    if (term) {
      list = list.filter(p =>
        (p.name || '').toLowerCase().includes(term) ||
        (p.brand || '').toLowerCase().includes(term) ||
        (p.sku || '').toLowerCase().includes(term)
      );
    }

    if (list.length === 0) {
      body.innerHTML = `<div class="empty-list">${allProducts.length === 0 ? 'Abhi tak koi product add nahi hua. "➕ Add Product" se shuru karo.' : 'Is filter/search se koi product nahi mila.'}</div>`;
      return;
    }

    body.innerHTML = list.map(p => {
      const stock = Number(p.stock) || 0;
      const reorder = Number(p.reorderLevel) || 0;
      let stockBadge;
      if (stock <= 0) stockBadge = `<span class="stock-badge stock-out">Out of Stock</span>`;
      else if (reorder > 0 && stock <= reorder) stockBadge = `<span class="stock-badge stock-low">Low Stock: ${stock}</span>`;
      else stockBadge = `<span class="stock-badge stock-ok">In Stock: ${stock}</span>`;

      return `
        <div class="prod-card">
          <div class="prod-info">
            <h4>${p.name || '(No name)'}</h4>
            <div class="prod-meta">
              ${p.category ? `<span>${p.category}</span>` : ''}
              ${p.brand ? `<span>${p.brand}</span>` : ''}
              ${p.sku ? `<span>SKU: ${p.sku}</span>` : ''}
            </div>
            <div class="prod-price">
              ${p.purchasePrice ? `<span class="old">Cost Rs.${p.purchasePrice}</span>` : ''}
              Rs. ${p.retailPrice || 0}
            </div>
            <div style="margin-top:6px">${stockBadge}</div>
          </div>
          <div class="prod-actions">
            <button class="btn-edit-p" onclick="window.location.href='Add-products-under-subtile.html?id=${p.id}'">✏️ Edit</button>
            <button class="btn-del-p" onclick="window.deleteProduct('${p.id}', '${(p.name || '').replace(/'/g, "\\'")}')">🗑️ Delete</button>
          </div>
        </div>`;
    }).join('');
  };

  window.deleteProduct = async function (id, name) {
    if (!confirm(`"${name}" ko delete karna hai? Yeh undo nahi ho sakta.`)) return;
    try {
      await deleteDoc(doc(tenantCollection(currentUid, "products"), id));
      allProducts = allProducts.filter(p => p.id !== id);
      window.renderProductList();
    } catch (err) {
      alert('Delete fail hua: ' + err.message);
    }
  };
</script>


</body>
</html>
