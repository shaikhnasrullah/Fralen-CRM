<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Favicon -->
<link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<link rel="shortcut icon" href="/favicon/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
<link rel="manifest" href="/favicon/site.webmanifest">
<meta name="description" content="FRALEN CRM is a multi-tenant optical shop management system — manage customers, orders, prescriptions, purchases, inventory, and sales reports for your eyewear business, all in one place."/>
<meta name="keywords" content="FRALEN CRM, optical shop CRM, eyewear shop software, optical store management, frame lens billing software"/>
<meta name="robots" content="index, follow"/>
<link rel="canonical" href="https://www.fralencrm.in/">

<title>Add Product</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #eef1f6;
    margin: 0;
    padding: 24px 16px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  .panel {
    background: #ffffff;
    border-radius: 10px;
    padding: 20px;
  }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 700;
    color: #374151;
    margin-bottom: 5px;
  }
  .field label .req { color: #dc2626; }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #d1d9ec;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: #1f2937;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none;
    border-color: #3b57e0;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .save-btn {
    width: 100%;
    padding: 13px;
    background: #d97706;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    margin-top: 4px;
  }
  .save-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .save-btn.success { background: #16a34a; }

  .status-msg { font-size: 13px; margin-top: 8px; text-align: center; }
  .status-msg.error { color: #dc2626; }
  .status-msg.ok { color: #16a34a; }
</style>
</head>
<body>

<div class="wrap">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
    <h2 id="page-heading" style="color:#1b2a6b;font-size:18px;font-weight:800">Add Product</h2>
    <button type="button" onclick="window.location.href='product-menu-sub-bar.html'" style="background:#eef1f6;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;color:#1b2a6b;cursor:pointer">← Product List</button>
  </div>
  <div class="panel">
    <form id="productForm">
      <div class="field">
        <label>Product Name <span class="req">*</span></label>
        <input type="text" id="f_name" placeholder="e.g. Ray-Ban Aviator RB3025" required>
      </div>

      <div class="row2">
        <div class="field">
          <label>Category</label>
          <select id="f_category">
            <option>Frames</option>
            <option>Lenses</option>
            <option>Contact Lenses</option>
            <option>Sunglasses</option>
            <option>Accessories</option>
            <option>Eye Drops</option>
          </select>
        </div>
        <div class="field">
          <label>Brand</label>
          <input type="text" id="f_brand" placeholder="e.g. Ray-Ban">
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label>SKU / Barcode</label>
          <input type="text" id="f_sku" placeholder="Optional">
        </div>
        <div class="field">
          <label>Reorder Level</label>
          <input type="number" id="f_reorder" placeholder="Low stock alert at">
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label>Purchase Price ₹</label>
          <input type="number" id="f_purchase" placeholder="0">
        </div>
        <div class="field">
          <label>Retail Price ₹</label>
          <input type="number" id="f_retail" placeholder="0">
        </div>
      </div>

      <div class="field">
        <label>Opening Stock — Branch Wise</label>
        <div class="row2" style="margin-bottom:10px">
          <div class="field"><label style="font-weight:500;font-size:12px">FRALEN Main Branch</label><input type="number" id="f_stock_main" placeholder="0"></div>
          <div class="field"><label style="font-weight:500;font-size:12px">FRALEN Branch 1</label><input type="number" id="f_stock_b1" placeholder="0"></div>
        </div>
        <div class="row2">
          <div class="field"><label style="font-weight:500;font-size:12px">FRALEN Branch 2</label><input type="number" id="f_stock_b2" placeholder="0"></div>
          <div class="field"><label style="font-weight:500;font-size:12px">FRALEN Branch 3</label><input type="number" id="f_stock_b3" placeholder="0"></div>
        </div>
      </div>

      <div class="field">
        <label>Notes</label>
        <textarea id="f_notes" rows="2" placeholder="Any notes..."></textarea>
      </div>

      <button type="submit" class="save-btn" id="saveBtn">Save Product</button>
      <div class="status-msg" id="statusMsg"></div>
    </form>
  </div>
</div>

<!-- Firebase (shared config — no more placeholder keys, no more global "products") -->
<script type="module">
  import { serverTimestamp, addDoc, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { requireAuth, tenantCollection } from "./firebase-config.js";

  // This form used to write to a global "products" collection with a
  // placeholder Firebase config that was never filled in — it couldn't
  // have actually saved anything before. Now it's wired to the real
  // shared config and scoped to users/{uid}/products.
  let currentUid = null;

  // Edit mode: product-menu-sub-bar.html links here as
  // Add-products-under-subtile.html?id=<productId> when "Edit" is clicked.
  const params = new URLSearchParams(window.location.search);
  const editId = params.get('id');

  requireAuth(async (user) => {
    currentUid = user.uid;
    if (editId) await loadForEdit();
  });

  async function loadForEdit() {
    document.getElementById('page-heading').textContent = 'Edit Product';
    document.getElementById('saveBtn').textContent = 'Update Product';
    try {
      const snap = await getDoc(doc(tenantCollection(currentUid, "products"), editId));
      if (!snap.exists()) { alert('Product nahi mila, shayad delete ho chuka hai.'); window.location.href = 'product-menu-sub-bar.html'; return; }
      const p = snap.data();
      document.getElementById('f_name').value = p.name || '';
      document.getElementById('f_category').value = p.category || 'Frames';
      document.getElementById('f_brand').value = p.brand || '';
      document.getElementById('f_sku').value = p.sku || '';
      document.getElementById('f_reorder').value = p.reorderLevel || '';
      document.getElementById('f_purchase').value = p.purchasePrice || '';
      document.getElementById('f_retail').value = p.retailPrice || '';
      const sb = p.stockByBranch || {};
      document.getElementById('f_stock_main').value = sb['FRALEN Main Branch'] || '';
      document.getElementById('f_stock_b1').value = sb['FRALEN Branch 1'] || '';
      document.getElementById('f_stock_b2').value = sb['FRALEN Branch 2'] || '';
      document.getElementById('f_stock_b3').value = sb['FRALEN Branch 3'] || '';
      document.getElementById('f_notes').value = p.notes || '';
    } catch (err) {
      alert('Product load karne mein error: ' + err.message);
    }
  }

  document.getElementById('productForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const saveBtn = document.getElementById('saveBtn');
    const statusMsg = document.getElementById('statusMsg');

    if (!currentUid) { statusMsg.textContent = "Login session nahi mila, dubara login karo."; statusMsg.className = "status-msg error"; return; }

    const name = document.getElementById('f_name').value.trim();
    if (!name) return;

    const stockByBranch = {
      'FRALEN Main Branch': Number(document.getElementById('f_stock_main').value) || 0,
      'FRALEN Branch 1': Number(document.getElementById('f_stock_b1').value) || 0,
      'FRALEN Branch 2': Number(document.getElementById('f_stock_b2').value) || 0,
      'FRALEN Branch 3': Number(document.getElementById('f_stock_b3').value) || 0,
    };
    const totalStock = Object.values(stockByBranch).reduce((s, v) => s + v, 0);

    const data = {
      name,
      category: document.getElementById('f_category').value,
      brand: document.getElementById('f_brand').value.trim(),
      sku: document.getElementById('f_sku').value.trim(),
      purchasePrice: Number(document.getElementById('f_purchase').value) || 0,
      retailPrice: Number(document.getElementById('f_retail').value) || 0,
      stockByBranch,
      stock: totalStock, // kept in sync for pages that just show a total (Product List, Reports)
      reorderLevel: Number(document.getElementById('f_reorder').value) || 0,
      notes: document.getElementById('f_notes').value.trim(),
    };
    if (!editId) data.createdAt = serverTimestamp();

    saveBtn.disabled = true;
    saveBtn.textContent = editId ? "Updating..." : "Saving...";
    statusMsg.textContent = "";
    statusMsg.className = "status-msg";

    try {
      if (editId) {
        await updateDoc(doc(tenantCollection(currentUid, "products"), editId), data);
      } else {
        await addDoc(tenantCollection(currentUid, "products"), data);
      }
      saveBtn.textContent = "Saved!";
      saveBtn.classList.add('success');
      statusMsg.textContent = editId ? "Product updated successfully." : "Product saved successfully.";
      statusMsg.classList.add('ok');
      setTimeout(() => {
        window.location.href = 'product-menu-sub-bar.html';
      }, 900);
    } catch (err) {
      console.error(err);
      saveBtn.disabled = false;
      saveBtn.textContent = editId ? "Update Product" : "Save Product";
      statusMsg.textContent = "Error: " + err.message;
      statusMsg.classList.add('error');
    }
  });
</script>

</body>
</html>
