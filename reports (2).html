<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FRALEN CRM — Reports</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #1B2A6B; --navy-light: #2A3F8F;
    --accent: #4F6BF0; --accent-soft: #EEF1FE;
    --gray: #6B7280; --border: #C5D3E8;
    --green: #10B981; --orange: #F59E0B; --red: #EF4444;
  }
  body { font-family: 'Inter', sans-serif; background: #f0f4f8; color: #111827; min-height: 100vh; }

  .topbar { background: var(--navy); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
  .topbar-logo { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 900; color: white; letter-spacing: 3px; }
  .topbar-logo span { color: #7B93FF; }
  .back-btn { background: rgba(255,255,255,0.15); color: white; border: none; padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }

  .page-title { background: white; padding: 14px 20px; font-size: 18px; font-weight: 700; color: var(--navy); border-bottom: 2px solid var(--accent); }

  .container { padding: 16px; max-width: 900px; margin: 0 auto; }

  /* DATE RANGE CARD */
  .range-card { background: white; border-radius: 12px; border: 1px solid var(--border); padding: 18px; margin-bottom: 18px; }
  .range-card h3 { font-size: 13px; font-weight: 700; color: var(--navy); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 12px; }
  .quick-range { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .qr-btn {
    padding: 8px 16px; border-radius: 9px; border: 1.5px solid var(--border); background: white;
    font-size: 13px; font-weight: 600; color: var(--navy); cursor: pointer; transition: background 0.15s, color 0.15s;
  }
  .qr-btn.active { background: var(--navy); color: white; border-color: var(--navy); }
  .custom-range { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .custom-range .field { display: flex; flex-direction: column; gap: 5px; }
  .custom-range label { font-size: 11.5px; font-weight: 600; color: #374151; }
  .custom-range input {
    padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 13px; font-family: 'Inter', sans-serif; outline: none;
  }
  .custom-range input:focus { border-color: var(--accent); }
  .range-label { margin-top: 12px; font-size: 12.5px; color: var(--gray); }
  .range-label b { color: var(--navy); }

  /* REPORT CARDS */
  .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .report-card {
    background: white; border-radius: 12px; border: 1px solid var(--border);
    padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .rc-top { display: flex; align-items: center; gap: 10px; }
  .rc-icon {
    width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center;
    justify-content: center; font-size: 18px; flex-shrink: 0;
  }
  .rc-icon.orders { background: #EEF1FE; }
  .rc-icon.customers { background: #ECFDF5; }
  .rc-icon.products { background: #FEF3C7; }
  .rc-icon.purchases { background: #FEE2E2; }
  .rc-icon.returns { background: #F3E8FF; }
  .rc-title { font-size: 14.5px; font-weight: 700; color: var(--navy); }
  .rc-count { font-size: 12px; color: var(--gray); }
  .rc-download {
    margin-top: auto; background: var(--accent-soft); color: var(--accent); border: none;
    border-radius: 8px; padding: 9px; font-size: 13px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .rc-download:hover { background: #DCE4FF; }
  .rc-btns { margin-top: auto; display: flex; gap: 8px; }
  .rc-btns .rc-download { flex: 1; margin-top: 0; }
  .rc-download.pdf { background: #FEE2E2; color: #B91C1C; }
  .rc-download.pdf:hover { background: #FECACA; }
  .all-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .all-download.pdf { background: #FEE2E2; color: #B91C1C; }
  .rc-download:disabled { opacity: 0.5; cursor: not-allowed; }

  .all-card {
    grid-column: span 2; background: var(--navy); border-radius: 12px; padding: 18px 20px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  .all-card .txt h3 { color: white; font-size: 15px; font-weight: 700; margin-bottom: 3px; }
  .all-card .txt p { color: rgba(255,255,255,0.65); font-size: 12.5px; }
  .all-download {
    background: white; color: var(--navy); border: none; border-radius: 9px;
    padding: 11px 22px; font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .all-download:hover { background: #EEF1FE; }

  .loading-note { text-align: center; padding: 30px; color: var(--gray); font-size: 13px; }

  @media (max-width: 600px) {
    .report-grid { grid-template-columns: 1fr; }
    .all-card { grid-column: span 1; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">FRAL<span>EN</span> CRM</div>
  <button class="back-btn" onclick="window.location.href='dashboard.html'">← Dashboard</button>
</div>

<div class="page-title">Reports &amp; Excel / PDF Export</div>

<div class="container">

  <div class="range-card">
    <h3>Select Date Range</h3>
    <div class="quick-range">
      <button class="qr-btn" data-range="today" onclick="window.setQuickRange('today')">Today</button>
      <button class="qr-btn" data-range="week" onclick="window.setQuickRange('week')">This Week</button>
      <button class="qr-btn active" data-range="month" onclick="window.setQuickRange('month')">This Month</button>
      <button class="qr-btn" data-range="year" onclick="window.setQuickRange('year')">This Year</button>
      <button class="qr-btn" data-range="all" onclick="window.setQuickRange('all')">All Time</button>
      <button class="qr-btn" data-range="custom" onclick="window.setQuickRange('custom')">Custom</button>
    </div>
    <div class="custom-range" id="custom-range-fields" style="display:none">
      <div class="field"><label>From Date</label><input type="date" id="range-from"/></div>
      <div class="field"><label>To Date</label><input type="date" id="range-to"/></div>
      <div class="field"><button class="qr-btn" style="border-color:var(--accent);color:var(--accent)" onclick="window.applyCustomRange()">Apply</button></div>
    </div>
    <div class="range-label" id="range-label">Showing: <b>This Month</b></div>
  </div>

  <div id="report-body" class="loading-note">Loading data...</div>

</div>

<script type="module" src="reports.js"></script>


</body>
</html>
